services:
  app:
    build: .
    image: file-drop
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-filedrop}
      DB_USER: ${DB_USER:-filedrop}
      DB_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}
      STORAGE_PATH: /var/www/html/storage
      CLAMAV_HOST: clamav
    volumes:
      - filedrop-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-filedrop}
      POSTGRES_USER: ${DB_USER:-filedrop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD nel file .env}
    volumes:
      - filedrop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav-db:/var/lib/clamav

volumes:
  filedrop-data:
  filedrop-db:
  clamav-db:
